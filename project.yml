name: Departures
options:
  bundleIdPrefix: com.maazsurti
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Departures:
    type: application
    platform: iOS
    sources:
      - path: Departures
    info:
      path: Departures/Info.plist
      properties:
        CFBundleDisplayName: Departures
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.maazsurti.departures
            CFBundleURLSchemes:
              - departures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maazsurti.departures
        TARGETED_DEVICE_FAMILY: "1,2"

  DeparturesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeparturesTests
    dependencies:
      - target: Departures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maazsurti.departures.tests
        GENERATE_INFOPLIST_FILE: YES

  DeparturesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DeparturesUITests
    dependencies:
      - target: Departures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maazsurti.departures.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Departures

schemes:
  Departures:
    build:
      targets:
        Departures: all
        DeparturesTests: [test]
        DeparturesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeparturesTests
        - DeparturesUITests
